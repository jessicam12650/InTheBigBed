<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog-friendly Liverpool — inthebigbed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F2EDE6;
      color: #1C1C1A;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: #F2EDE6;
      border-bottom: 1px solid #1C1C1A;
      height: 64px;
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -1px;
      color: #1C1C1A;
      text-decoration: none;
    }
    .nav-back {
      font-weight: 700;
      font-size: 14px;
      color: #1C1C1A;
      text-decoration: none;
      border: 1px solid #1C1C1A;
      padding: 8px 16px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-back:hover { background: #1C1C1A; color: #F2EDE6; }

    /* ── PAGE HEADER ── */
    .page-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 48px 40px;
    }
    .page-heading {
      font-weight: 900;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .page-sub {
      font-size: 18px;
      color: #555;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* ── FILTERS ── */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 9px 18px;
      border-radius: 4px;
      border: 1.5px solid #1C1C1A;
      background: transparent;
      color: #1C1C1A;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .filter-btn:hover { background: rgba(28,28,26,0.08); }
    .filter-btn.active { background: #1C1C1A; color: #F2EDE6; }

    /* ── MAP ── */
    #map {
      width: 100%;
      height: 480px;
      border-top: 1px solid #1C1C1A;
      border-bottom: 1px solid #1C1C1A;
      display: block;
    }

    /* ── VENUES SECTION ── */
    .venues-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 48px 96px;
    }
    .venues-section-heading {
      font-weight: 900;
      font-size: 26px;
      margin-bottom: 32px;
    }
    .venue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav { padding: 0 20px; height: 56px; }
      .nav-logo { font-size: 18px; }
      .page-header { padding: 40px 20px 28px; }
      #map { height: 320px; }
      .venues-section { padding: 40px 20px 64px; }
      .venue-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-logo" href="index.html">inthebigbed</a>
    <a class="nav-back" href="index.html">← Back to home</a>
  </nav>

  <div class="page-header">
    <h1 class="page-heading">Dog-friendly Liverpool</h1>
    <p class="page-sub">Pubs, bars, cafes and restaurants that actually welcome your dog.</p>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pub-bar">Pubs and Bars</button>
      <button class="filter-btn" data-filter="restaurant">Restaurants</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="venues-section">
    <h2 class="venues-section-heading">Dog-friendly bars and restaurants in Liverpool</h2>
    <div class="venue-grid" id="venue-grid">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <script>
    const LIVERPOOL = { lat: 53.4084, lng: -2.9916 };

    function initMap() {
      new google.maps.Map(document.getElementById('map'), {
        center: LIVERPOOL,
        zoom: 13,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        styles: [
          { featureType: 'poi',       elementType: 'all',             stylers: [{ visibility: 'off' }] },
          { featureType: 'transit',   elementType: 'labels.icon',     stylers: [{ visibility: 'off' }] },
          { featureType: 'road',      elementType: 'geometry.fill',   stylers: [{ color: '#ffffff' }] },
          { featureType: 'road',      elementType: 'geometry.stroke', stylers: [{ color: '#e0d8ce' }] },
          { featureType: 'landscape', elementType: 'geometry.fill',   stylers: [{ color: '#f5f0ea' }] },
          { featureType: 'water',     elementType: 'geometry.fill',   stylers: [{ color: '#bdd5e0' }] },
        ],
      });
    }

    /* Filter buttons */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIaK7AvsGOUBhmRojkTG4bC-tPLUEIJBY&libraries=places&callback=initMap">
  </script>

</body>
</html>
